[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag-system2"
version = "0.1.0"
description = "Hybrid RAG backend (FastAPI + LangGraph)"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.28.0",
    "langchain>=1.3.16",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.52.4",
]

[tool.setuptools]
py-modules = ["config", "app"]
packages = [
    "server",
    "graph",
    "ingestion",
    "retrieval",
    "generation",
    "guardrails",
]
